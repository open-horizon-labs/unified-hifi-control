# QNAP Package Configuration for QDK2
QPKG_NAME="unified-hifi-control"
QPKG_DISPLAY_NAME="Unified Hi-Fi Control by Open Horizon Labs"
QPKG_VER="{{VERSION}}"
QPKG_AUTHOR="Open Horizon Labs"
QPKG_LICENSE="PolyForm Noncommercial 1.0.0"
QPKG_SUMMARY="Unified music control for services, HiPhi controllers, automation, and AI agents"

# No dependencies - uses static musl-linked binary

# Service configuration
QPKG_RC_NUM="101"
QPKG_SERVICE_PROGRAM="unified-hifi-control.sh"
QPKG_SERVICE_PORT="8088"
QPKG_WEB_PORT="8088"
QPKG_WEBUI="/"

# QDK2 directory structure - shared only (static binary)
QDK_DATA_DIR_SHARED="shared"

# Package icons
QPKG_ICON64="icons/unified-hifi-control_64.png"
QPKG_ICON80="icons/unified-hifi-control_80.png"
