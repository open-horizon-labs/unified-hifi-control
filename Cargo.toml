[package]
name = "unified-hifi-control"
version = "0.0.0"  # Injected from git tag at build time
edition = "2021"
authors = ["Muness Castle"]
description = "Source-agnostic hi-fi control bridge for hardware surfaces and Home Assistant"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/open-horizon-labs/unified-hifi-control"

[features]
# Default to server for standalone cargo build/test (dx build uses explicit features)
default = ["server"]
server = [
    "dioxus/fullstack",
    "dioxus/server",
    "dep:axum",
    "dep:tokio",
    "dep:tower",
    "dep:tower-http",
    "dep:roon-api",
    "dep:reqwest",
    "dep:tokio-tungstenite",
    "dep:tracing-subscriber",
    "dep:tracing-appender",
    "dep:config",
    "dep:image",
    "dep:resvg",
    "dep:tokio-stream",
    "dep:tokio-util",
    "dep:ssdp-client",
    "dep:mdns-sd",
    "dep:gethostname",
    "dep:if-addrs",
    "dep:rust-embed",
    "dep:mime_guess",
    "dep:http-body-util",
    "dep:rust-mcp-sdk",
    "dep:rumqttc",
    "dep:ed25519-dalek",
    "dep:uuid",
]
# The browser bundle still needs Dioxus fullstack's hydration support so it
# can attach to SSR markup. This does not enable the server target; that stays
# behind the separate `server` feature used by native binaries.
web = ["dioxus/web", "dioxus/fullstack"]

[dependencies]
# Dioxus UI framework (SSR + client hydration + router)
dioxus = { version = "0.7.10", features = ["router"] }
dioxus-sdk-time = "0.7"

# Serialization (shared)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crypto/hashing (shared - pure Rust)
md5 = "0.8"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
uuid = { version = "1", features = ["serde", "v4"], optional = true }

# Regex (shared)
regex = "1"

# URL encoding/parsing (shared)
urlencoding = "2"
url = "2"

# XML parsing (shared)
quick-xml = { version = "0.41", features = ["serialize"] }

# Logging (shared - tracing works in WASM)
tracing = "0.1"

# Error handling (shared)
thiserror = "2"
anyhow = "1.0.103"

# Date/time (shared)
chrono = { version = "0.4", features = ["serde"] }

# Async utilities (shared)
futures = "0.3"
async-trait = "0.1"

# Base64 (shared)
base64 = "0.22.1"

# Authenticated encryption for provider credentials at rest
chacha20poly1305 = "0.10"

# Dioxus UI primitives (shared - needed for SSR and client hydration)
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", version = "0.0.1", default-features = false, features = ["router"] }

# ============ SERVER-ONLY DEPENDENCIES ============
# These are optional and only included when building for server

# Web framework (server only)
axum = { version = "0.8", features = ["macros"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "trace"], optional = true }

# Roon API (server only)
roon-api = { git = "https://github.com/open-horizon-labs/rust-roon-api.git", branch = "ohc/main", features = ["transport", "image", "status", "browse"], optional = true }
# TODO: Switch back to upstream after TheAppgineer/rust-roon-api#1 and #2 are merged

# HTTP client (server only)
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls"], optional = true }

# WebSocket client (server only) - Music Assistant event subscription (#506).
# rustls to match reqwest's TLS backend rather than pulling in a second (native-tls)
# implementation.
tokio-tungstenite = { version = "0.21", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"], optional = true }

# Logging subscriber (server only - needs tokio)
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
tracing-appender = { version = "0.2.5", optional = true }

# Config (server only)
config = { version = "0.15", optional = true }

# Image processing (server only)
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"], optional = true }

# Tokio stream utilities (server only)
tokio-stream = { version = "0.1", features = ["sync"], optional = true }
tokio-util = { version = "0.7", optional = true }

# SSDP/UPnP/mDNS discovery (server only)
ssdp-client = { version = "2", optional = true }
mdns-sd = { version = "0.17.2", optional = true }
gethostname = { version = "1.1.0", optional = true }
if-addrs = { version = "0.14", optional = true }

# Embedded assets for single-binary distribution (server only, ADR 002)
rust-embed = { version = "8", optional = true }
mime_guess = { version = "2", optional = true }
http-body-util = { version = "0.1", optional = true }

# SVG rasterization (server only)
resvg = { version = "0.47.0", features = ["default"], optional = true }

# MCP server (server only)
rust-mcp-sdk = { version = "0.8", default-features = false, features = ["server", "macros", "hyper-server", "sse"], optional = true }

# MQTT publisher for Home Assistant discovery (server only, issue #508)
rumqttc = { version = "0.24", default-features = false, features = ["use-rustls"], optional = true }

# Public-key-only verification and locally held installation identity for the
# optional outbound HiPhi Cloud connector. The cloud signing key never enters UHC.
ed25519-dalek = { version = "2.2", features = ["rand_core"], optional = true }

# ============ WEB-ONLY DEPENDENCIES ============
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Location", "Navigator", "Clipboard", "Document", "HtmlDocument", "HtmlElement", "HtmlTextAreaElement", "CssStyleDeclaration", "Node", "Element", "DomTokenList", "Storage", "Request", "RequestInit", "Response", "Headers", "EventSource", "MessageEvent", "Performance", "PerformanceEntry"] }
serde-wasm-bindgen = "0.6"
# getrandom needs js feature for WASM (used by rand)
getrandom = { version = "0.2", features = ["js"] }

[[bin]]
name = "unified-hifi-control"
path = "src/main.rs"

[[bin]]
name = "protocol-checker"
path = "src/bin/protocol_checker.rs"
required-features = ["server"]

[[bin]]
name = "uhc-hiphi-pair"
path = "src/bin/uhc_hiphi_pair.rs"
required-features = ["server"]

[dev-dependencies]
tokio-test = "0.4"
serial_test = "3"
# Client-side transport only, for tests/mcp_hqplayer_control.rs driving the real MCP HTTP
# surface end to end. Additive to the "server"-feature dependency above; a dev-only feature
# union does not reach a normal `cargo build --release` (which never compiles dev-dependencies).
rust-mcp-sdk = { version = "0.8", default-features = false, features = ["client", "streamable-http"] }
syn = { version = "2", features = ["full", "parsing", "visit"] }
# Token-level inspection for tests/adaptive_publication_lint.rs. Already in the lock
# graph as a transitive dependency of syn; declared so the lint can walk TokenTree
# without stringifying a macro body, which made string literals fabricate matches.
proc-macro2 = { version = "1", features = ["span-locations"] }
walkdir = "2"
tempfile = "3"
# tokio-tungstenite moved to [dependencies] (#506): the Music Assistant adapter now
# needs a WebSocket *client* in production, and tests/mock_servers/roon_core.rs's
# WebSocket *server* fake shares that same declaration.
# In-process MQTT broker for tests/mqtt_integration.rs (issue #508). Pure-Rust,
# embeddable, and wire-compatible with the `rumqttc` client used by the publisher -
# this is the "mock/in-process broker" the issue's acceptance criteria calls for.
rumqttd = { version = "0.19", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Cross-compilation targets for static musl builds
# Build with: cargo build --release --target x86_64-unknown-linux-musl
# Or use cross: cross build --release --target x86_64-unknown-linux-musl
# Available targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl, armv7-unknown-linux-musleabihf
