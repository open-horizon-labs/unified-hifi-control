name: Device mismatch report (alpha)
description: A receiver, amplifier or streamer behaved differently from what UHC expected. Usually generated from UHC's "Report a device mismatch".
title: "[device-mismatch] "
labels: ["device-mismatch", "alpha"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks — reports like this are how UHC's device support moves from *implementation-derived* to *hardware-verified*.
        The text below was generated by UHC and redacted on your machine (`**REDACTED**` marks removed values). Review it before submitting.
        If UHC offered a bundle file (`uhc-device-mismatch-*.json`), please attach it: maintainers can turn it into a test fixture.
  - type: textarea
    id: report
    attributes:
      label: Generated report
      description: Device, mismatches, and (if you chose) protocol excerpts, redacted.
      render: markdown
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: What you were doing
      description: Optional. Which control (knob, Watch, Home Assistant, MCP) and what you expected.
    validations:
      required: false
  - type: checkboxes
    id: review
    attributes:
      label: Privacy check
      options:
        - label: I reviewed the report and it contains nothing I don't want public.
          required: true
