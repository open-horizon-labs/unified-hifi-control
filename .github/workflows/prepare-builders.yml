name: Prepare build environments

on:
  workflow_dispatch:
  push:
    branches: [codex/issue-760-prepared-builders]
    paths:
      - '.github/workflows/prepare-builders.yml'
      - 'build/prepared-builders/**'
      - 'rust-toolchain.toml'
      - '.github/actions/setup-rust/**'

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check out the reviewed converter
        uses: actions/checkout@v6
        with:
          repository: open-horizon-labs/homelab-infra
          ref: 7d44b9e
          path: .builder-infra
          sparse-checkout: runner/builder
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r .builder-infra/runner/builder/requirements.txt
      - name: Generate the environment from canonical Actions setup
        run: |
          python .builder-infra/runner/builder/convert.py .github/workflows/build.yml \
            --setup-source build/prepared-builders/source.yml \
            --config build/prepared-builders/profile.json \
            --output "$RUNNER_TEMP/prepared-builder"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish hosted tools once
        run: |
          image=$(python -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"] + "/prepared-builder/manifest.json"))["image"])')
          docker build --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --tag "$image" "$RUNNER_TEMP/prepared-builder"
          docker push "$image"
      - uses: actions/upload-artifact@v7
        with:
          name: prepared-builder
          path: ${{ runner.temp }}/prepared-builder/
          retention-days: 30
