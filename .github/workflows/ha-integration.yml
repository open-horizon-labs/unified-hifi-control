name: Home Assistant integration

# Tests for the HACS custom_components/unified_hifi_control Python
# package. This job is intentionally independent of the Rust crate's
# build/CI (build.yml) since it has its own toolchain and dependencies.
#
# The streaming/companion alpha branch is also an active integration target;
# changes there need the same package-level evidence before review.

on:
  push:
    branches: [v3, 'integration/streaming-ha-alpha']
    paths:
      - "custom_components/unified_hifi_control/**"
      - "hacs.json"
      - "pyproject.toml"
      - ".github/workflows/ha-integration.yml"
  pull_request:
    branches: [v3, 'integration/streaming-ha-alpha']
    paths:
      - "custom_components/unified_hifi_control/**"
      - "hacs.json"
      - "pyproject.toml"
      - ".github/workflows/ha-integration.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Home Assistant's current minimum is Python 3.13; 3.12 also trips a
        # pycares thread-leak false positive in the test framework's teardown.
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: custom_components/unified_hifi_control/requirements_test.txt

      - name: Install test dependencies
        run: pip install -r custom_components/unified_hifi_control/requirements_test.txt


      - name: Run pytest
        run: pytest custom_components/unified_hifi_control/tests -v

  hacs-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          # TODO(#519 follow-up): brands needs a home-assistant/brands PR;
          # topics and license are repo-level settings (GitHub topics, SPDX-
          # recognizable LICENSE). All three gate HACS *default-store* listing
          # only -- custom-repository installs work without them.
          ignore: "brands topics license"

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
