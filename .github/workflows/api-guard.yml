name: API Guard

on:
  pull_request:
    branches: [master, v3, v4]
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - '.github/workflows/api-guard.yml'
      - 'src/main.rs'
      - 'src/api/**'
      - 'tests/fixtures/api_routes.txt'

permissions:
  contents: read
  pull-requests: read

jobs:
  check-api-changes:
    name: Check API Changes
    runs-on: ${{ vars.LOCAL_LINUX_CI_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","linux-general"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for API route changes
        id: check
        run: |
          # Check if api_routes.txt changed
          if git diff origin/${{ github.base_ref }}..HEAD --name-only | grep -q 'tests/fixtures/api_routes.txt'; then
            echo "api_changed=true" >> $GITHUB_OUTPUT
          else
            echo "api_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Require approval label for API changes
        if: steps.check.outputs.api_changed == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: context.issue.number,
            });
            if (pr.labels.some(label => label.name === 'api-change-approved')) {
              core.info('API change approved via label');
            } else {
              core.setFailed('API contract changed. Review the changes and add api-change-approved to this PR.');
            }

      - name: API unchanged
        if: steps.check.outputs.api_changed == 'false'
        run: echo "✅ No API contract changes detected"
