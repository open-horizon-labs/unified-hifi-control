name: HiPhi Cloud connector

on:
  pull_request:
    branches: [v4, 'integration/v4-hiphi-readiness-2026-10-02']
    paths:
      - "rust-toolchain.toml"
      - ".github/actions/setup-rust/action.yml"
      - '.github/workflows/hiphi-cloud-connector.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/cloud_connector/**'
      - 'src/app/**'
      - 'src/api/hiphi_pairing.rs'
      - 'tests/hiphi_recovery.rs'
      - 'tests/hiphi_pairing_ui_contract.rs'
      - 'src/lib.rs'
      - 'src/main.rs'
      - 'tests/cloud_connector.rs'
      - 'tests/fixtures/api_routes.txt'
      - 'tests/fixtures/hiphi-relay-v1/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  connector:
    name: Connector contracts and zero-trust boundary
    runs-on: ${{ vars.LOCAL_LINUX_CI_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","linux-general"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-rust
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Build embedded CSS prerequisite
        run: make css

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Test connector contracts
        run: cargo test --features server --test cloud_connector

      - name: Test the production connector runtime
        run: cargo test --features server --lib cloud_connector

      - name: Test connection recovery presentation
        run: |
          cargo test --features server --lib cloud_connection
          cargo test --features server --test hiphi_recovery --test hiphi_pairing_ui_contract

      - name: Preserve the public HTTP API contract
        run: cargo test --features server --test api_contract

      - name: Compile the server integration
        run: cargo check --features server

      - name: Reject connector warnings
        run: cargo clippy --features server --lib --bin uhc-hiphi-pair -- -D warnings
