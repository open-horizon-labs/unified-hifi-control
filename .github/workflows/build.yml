  build-applemusic-companion-dmg:
    name: Build Apple Music Companion DMG (macOS arm64)
    needs: [plan]
    if: needs.plan.outputs.build_applemusic_macos == 'true'
    runs-on: macos-latest
    # `secrets` isn't allowed directly in step `if:` conditions, so surface
    # presence checks as job-level env vars instead.
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12 != '' && secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD != '' }}
      HAS_APPLE_NOTARY: ${{ secrets.APPLE_NOTARY_KEY_P8 != '' && secrets.APPLE_NOTARY_KEY_ID != '' && secrets.APPLE_NOTARY_KEY_ISSUER_ID != '' }}
    steps:
      - uses: actions/checkout@v6

      # macOS signing/notarization (issue #561): the owner already has an
      # Apple Developer Program membership, so this only needs the two
      # secret groups below - no code changes once they're added.
      #   APPLE_DEVELOPER_ID_CERT_P12       - base64 of a "Developer ID
      #                                        Application" .p12 export
      #   APPLE_DEVELOPER_ID_CERT_PASSWORD  - password for that .p12
      #   APPLE_DEVELOPMENT_TEAM_ID         - 10-char Apple Team ID
      #   APPLE_NOTARY_KEY_P8               - base64 App Store Connect API
      #                                        key (.p8) for notarytool
      #   APPLE_NOTARY_KEY_ID               - key ID for the API key above
      #   APPLE_NOTARY_KEY_ISSUER_ID        - issuer ID for the API key
      # Until they exist, this falls back to the same unsigned/ad-hoc build
      # CI has always produced - no behavior change.
      - name: Import Developer ID signing certificate
        id: import-cert
        if: ${{ env.HAS_APPLE_CERT == 'true' }}
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # shellcheck disable=SC2046  # word splitting is intentional: each existing keychain path becomes its own -s argument
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.+)"/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity found in the imported certificate."
            exit 1
          fi
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "has_cert=true" >> "$GITHUB_OUTPUT"

      - name: Build signed arm64 DMG
        if: steps.import-cert.outputs.has_cert == 'true'
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          CODE_SIGN_IDENTITY: ${{ steps.import-cert.outputs.identity }}
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM_ID }}
          CODE_SIGNING_REQUIRED: "YES"
        run: companion/apple_music/build-dmg.sh

      # No signing identity is available, so this produces an unsigned/ad-hoc
      # DMG - the same thing CI has always shipped. ARM64 (Apple Silicon)
      # only - by design, not a gap: see companion/apple_music/README.md for
      # the right-click-Open / xattr workaround users need on first launch.
      - name: Build unsigned arm64-only DMG
        if: steps.import-cert.outputs.has_cert != 'true'
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: companion/apple_music/build-dmg.sh

      - name: Notarize and staple DMG
        if: steps.import-cert.outputs.has_cert == 'true' && env.HAS_APPLE_NOTARY == 'true'
        env:
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_KEY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_KEY_ISSUER_ID }}
        run: |
          DMG_PATH=$(ls companion/apple_music/dist/*.dmg)
          KEY_PATH="$RUNNER_TEMP/notary-key.p8"
          echo "$APPLE_NOTARY_KEY_P8" | base64 --decode > "$KEY_PATH"

          xcrun notarytool submit "$DMG_PATH" \
            --key "$KEY_PATH" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_KEY_ISSUER_ID" \
            --wait

          xcrun stapler staple "$DMG_PATH"
          rm -f "$KEY_PATH"

      - name: Note unsigned/unnotarized DMG
        if: steps.import-cert.outputs.has_cert != 'true'
        run: echo "::notice::APPLE_DEVELOPER_ID_CERT_P12/APPLE_DEVELOPER_ID_CERT_PASSWORD not set - DMG ships unsigned/ad-hoc. See docs/gh-release.md#release-signing."

      - name: Note unnotarized DMG
        if: steps.import-cert.outputs.has_cert == 'true' && env.HAS_APPLE_NOTARY != 'true'
        run: echo "::notice::APPLE_NOTARY_KEY_P8/APPLE_NOTARY_KEY_ID/APPLE_NOTARY_KEY_ISSUER_ID not set - DMG is signed but not notarized/stapled. See docs/gh-release.md#release-signing."

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: applemusic-companion-dmg
          path: companion/apple_music/dist/*.dmg
          retention-days: 5

  build-windows:
    name: Build Windows
    needs: [plan, build-wasm]
    if: needs.plan.outputs.build_windows == 'true'
    runs-on: windows-latest
    # `secrets` isn't allowed directly in step `if:` conditions, so surface
    # the presence check as a job-level env var instead.
    env:
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 != '' && secrets.WINDOWS_SIGNING_CERT_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          # v0.17 expands Cargo's Rust argfiles before spawning rustc, which
          # exceeds Windows' command-line limit for crates such as web-sys.
          # Remove this pin once https://github.com/mozilla/sccache/issues/2787 is fixed.
          version: v0.16.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows

      - name: Download WASM assets
        uses: actions/download-artifact@v8
        with:
          name: wasm-assets
          path: target/dx/unified-hifi-control/release/web/

      - name: Cache generated CSS
        id: cache-css
        uses: actions/cache@v5
        with:
          path: public/tailwind.css
          key: css-v4.1.18-${{ hashFiles('src/input.css', 'src/app/pages/*.rs', 'src/app/components/*.rs') }}

      - name: Build Tailwind CSS
        if: steps.cache-css.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl -sLO https://github.com/tailwindlabs/tailwindcss/releases/download/v4.1.18/tailwindcss-windows-x64.exe
          chmod +x tailwindcss-windows-x64.exe
          ./tailwindcss-windows-x64.exe -i src/input.css -o public/tailwind.css --content "src/app/**/*.rs"

      - name: Build (embeds WASM)
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
          UHC_VERSION: ${{ needs.plan.outputs.version }}
          UHC_GIT_SHA: ${{ needs.plan.outputs.git_sha }}
        run: |
          # Force rebuild of main crate to pick up version env vars and embedded assets
          cargo clean -p unified-hifi-control 2>/dev/null || true
          cargo build --release
        shell: bash

      - name: Rename binary
        shell: bash
        run: |
          mkdir -p dist/bin
          cp target/release/unified-hifi-control.exe dist/bin/unified-hifi-win64.exe
          cp target/release/uhc-hiphi-pair.exe dist/bin/uhc-hiphi-pair-win64.exe

      # Windows Authenticode signing (issue #561): deferred until Windows
      # matters commercially. Prepared but inactive - gated on
      # WINDOWS_SIGNING_CERT_BASE64/WINDOWS_SIGNING_CERT_PASSWORD, which do
      # not exist yet, so this step is a no-op today. When the owner is
      # ready (an Azure Trusted Signing subscription or an OV cert), either
      # populate those two secrets for a traditional PFX cert, or swap this
      # step for azure/trusted-signing-action and its AZURE_TRUSTED_SIGNING_*
      # secrets - both are viable, pick whichever the owner buys.
      - name: Sign Windows binaries (Authenticode)
        if: ${{ env.HAS_WINDOWS_CERT == 'true' }}
        shell: bash
        env:
          CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          echo "$CERT_BASE64" | base64 --decode > cert.pfx
          SIGNTOOL=$(find "/c/Program Files (x86)/Windows Kits/10/bin" -name signtool.exe -path "*x64*" | sort | tail -1)
          if [ -z "$SIGNTOOL" ]; then
            echo "::error::signtool.exe not found on this runner image - verify the Windows SDK path before enabling this step."
            exit 1
          fi
          "$SIGNTOOL" sign /f cert.pfx /p "$CERT_PASSWORD" /tr http://timestamp.digicert.com /td sha256 /fd sha256 dist/bin/unified-hifi-win64.exe
          "$SIGNTOOL" sign /f cert.pfx /p "$CERT_PASSWORD" /tr http://timestamp.digicert.com /td sha256 /fd sha256 dist/bin/uhc-hiphi-pair-win64.exe
          "$SIGNTOOL" verify /pa dist/bin/unified-hifi-win64.exe
          "$SIGNTOOL" verify /pa dist/bin/uhc-hiphi-pair-win64.exe
          rm -f cert.pfx

      - name: Note unsigned Windows binary
        if: ${{ env.HAS_WINDOWS_CERT != 'true' }}
        shell: bash
        run: echo "::notice::Windows signing deferred (WINDOWS_SIGNING_CERT_BASE64/WINDOWS_SIGNING_CERT_PASSWORD not set) - binary ships unsigned. See docs/gh-release.md#release-signing."

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: binary-windows
          path: dist/bin/
          retention-days: 5

  # Universal ZIP: all platform binaries bundled
  # Uses LMS platform folder structure so findBin() works automatically
  # Note: Web assets are embedded in the binary (ADR 002), no separate assets needed
  build-lms-universal:
    name: Build LMS Plugin (universal)
    needs: [plan, build-linux-x64, build-linux-arm, build-macos-universal, build-windows]
    if: |
      always() &&
      needs.plan.outputs.build_lms == 'true' &&
      needs.build-linux-x64.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Download all available binaries
      - name: Download Linux x64 binary
        uses: actions/download-artifact@v8
        with:
          name: binary-x86_64-unknown-linux-musl
          path: binaries/

      - name: Download Linux ARM64 binary
        uses: actions/download-artifact@v8
        if: needs.build-linux-arm.result == 'success'
        continue-on-error: true
        with:
          name: binary-aarch64-unknown-linux-musl
          path: binaries/

      - name: Download Linux ARMv7 binary
        uses: actions/download-artifact@v8
        if: needs.build-linux-arm.result == 'success'
        continue-on-error: true
        with:
          name: binary-armv7-unknown-linux-musleabihf
          path: binaries/

      - name: Download macOS binary
        uses: actions/download-artifact@v8
        if: needs.build-macos-universal.result == 'success'
        continue-on-error: true
        with:
          name: binary-macos-universal
          path: binaries/

      - name: Download Windows binary
        uses: actions/download-artifact@v8
        if: needs.build-windows.result == 'success'
        continue-on-error: true
        with:
          name: binary-windows
          path: binaries/

      - name: Update install.xml version
        run: |
          sed -i "s|<version>[^<]*</version>|<version>${{ needs.plan.outputs.version }}</version>|" lms-plugin/install.xml

      - name: Bundle LMS plugin with all binaries
        run: |
          mkdir -p dist
          cd lms-plugin

          # Create platform-specific Bin directories (LMS findBin convention)
          # See: https://github.com/LMS-Community/slimserver/tree/public/9.1/Bin
          mkdir -p Bin/x86_64-linux
          mkdir -p Bin/aarch64-linux
          mkdir -p Bin/arm-linux
          mkdir -p Bin/darwin
          mkdir -p Bin/MSWin32-x64-multi-thread

          # Copy binaries to their platform folders
          # All use same name so LMS findBin('unified-hifi-control') works
          if [ -f ../binaries/unified-hifi-linux-x64 ]; then
            cp ../binaries/unified-hifi-linux-x64 Bin/x86_64-linux/unified-hifi-control
            cp ../binaries/uhc-hiphi-pair-x64 Bin/x86_64-linux/uhc-hiphi-pair
            chmod +x Bin/x86_64-linux/unified-hifi-control
            chmod +x Bin/x86_64-linux/uhc-hiphi-pair
          fi

          if [ -f ../binaries/unified-hifi-linux-arm64 ]; then
            cp ../binaries/unified-hifi-linux-arm64 Bin/aarch64-linux/unified-hifi-control
            cp ../binaries/uhc-hiphi-pair-arm64 Bin/aarch64-linux/uhc-hiphi-pair
            chmod +x Bin/aarch64-linux/unified-hifi-control
            chmod +x Bin/aarch64-linux/uhc-hiphi-pair
          fi

          if [ -f ../binaries/unified-hifi-linux-armv7 ]; then
            cp ../binaries/unified-hifi-linux-armv7 Bin/arm-linux/unified-hifi-control
            cp ../binaries/uhc-hiphi-pair-armv7 Bin/arm-linux/uhc-hiphi-pair
            chmod +x Bin/arm-linux/unified-hifi-control
            chmod +x Bin/arm-linux/uhc-hiphi-pair
          fi

          if [ -f ../binaries/unified-hifi-macos-universal ]; then
            cp ../binaries/unified-hifi-macos-universal Bin/darwin/unified-hifi-control
            cp ../binaries/uhc-hiphi-pair-macos-universal Bin/darwin/uhc-hiphi-pair
            chmod +x Bin/darwin/unified-hifi-control
            chmod +x Bin/darwin/uhc-hiphi-pair
          fi

          if [ -f ../binaries/unified-hifi-win64.exe ]; then
            cp ../binaries/unified-hifi-win64.exe Bin/MSWin32-x64-multi-thread/unified-hifi-control.exe
            cp ../binaries/uhc-hiphi-pair-win64.exe Bin/MSWin32-x64-multi-thread/uhc-hiphi-pair.exe
          fi

          # Note: Web assets are embedded in the binary (ADR 002)
          # No separate public/ folder needed

          # Show what we bundled
          echo "Bundled binaries:"
          find Bin -type f -name "unified-hifi-control*" | head -20

          # Create ZIP with everything
          zip -r ../dist/lms-unified-hifi-control-${{ needs.plan.outputs.version }}.zip . \
            -x "*.git*"

      - name: Repack with correct directory structure
        run: |
          cd dist
          mkdir -p repack
          unzip lms-unified-hifi-control-${{ needs.plan.outputs.version }}.zip -d repack/UnifiedHiFi
          rm lms-unified-hifi-control-${{ needs.plan.outputs.version }}.zip
          cd repack
          zip -r ../lms-unified-hifi-control-${{ needs.plan.outputs.version }}.zip UnifiedHiFi
          cd ..
          rm -rf repack

      - name: Upload LMS plugin
        uses: actions/upload-artifact@v7
        with:
          name: lms-plugin
          path: dist/lms-unified-hifi-control-*.zip
          retention-days: 5

  # =============================================================================
  # PACKAGING: Depends on binaries (web assets embedded per ADR 002)
  # =============================================================================

  # Note: Web assets are embedded in the binary (ADR 002)
  build-synology:
    name: Build Synology SPK (${{ matrix.arch }})
    needs: [plan, build-linux-x64, build-linux-arm, synology-package-test]
    # DSM rejects prerelease version strings (e.g. 3.7.0-alpha.1), so skip
    # Synology entirely on prerelease tags rather than failing the matrix.
    if: |
      always() &&
      needs.plan.outputs.build_synology == 'true' &&
      !contains(needs.plan.outputs.version, '-') &&
      needs.build-linux-x64.result == 'success' &&
      needs.synology-package-test.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            cpu_arch: x86_64
            target: x86_64-unknown-linux-musl
            binary: unified-hifi-linux-x64
            pairing_helper: uhc-hiphi-pair-x64
          - arch: armv8
            cpu_arch: armv8
            target: aarch64-unknown-linux-musl
            binary: unified-hifi-linux-arm64
            pairing_helper: uhc-hiphi-pair-arm64
    steps:
      - uses: actions/checkout@v6

      - name: Check if binary available
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          if [[ "${{ needs.build-linux-arm.result }}" != "success" ]]; then
            echo "::warning::ARM build not available, skipping ${{ matrix.arch }}"
            exit 1
          fi

      - name: Download Linux binary
        uses: actions/download-artifact@v8
        with:
          name: binary-${{ matrix.target }}
          path: dist/synology-binary/

      - name: Build Synology SPK
        run: |
          SPK_NAME="unified-hifi-control-${{ matrix.cpu_arch }}-${{ needs.plan.outputs.version }}-dsm7.spk"
          build/synology/build-spk.sh \
            "${{ needs.plan.outputs.version }}" \
            "${{ matrix.arch }}" \
            "dist/synology-binary/${{ matrix.binary }}" \
            "dist/synology-binary/${{ matrix.pairing_helper }}" \
            "dist/installers/${SPK_NAME}"

      - name: Upload Synology package
        uses: actions/upload-artifact@v7
        with:
          name: synology-${{ matrix.cpu_arch }}
          path: dist/installers/*.spk
          retention-days: 5

  # Note: Web assets are embedded in the binary (ADR 002)
  build-qnap-x64:
    name: Build QNAP (x64)
    needs: [plan, build-linux-x64, qnap-package-test]
    if: |
      needs.plan.outputs.build_qnap == 'true' &&
      needs.qnap-package-test.result == 'success'
    runs-on: ubuntu-latest
    # `secrets` isn't allowed directly in step `if:` conditions, so surface
    # the presence check as a job-level env var instead.
    env:
      HAS_QNAP_SIGNING: ${{ secrets.QNAP_SIGNING_CERT != '' && secrets.QNAP_SIGNING_KEY != '' }}
    steps:
      - uses: actions/checkout@v6

      - name: Download Linux binary
        uses: actions/download-artifact@v8
        with:
          name: binary-x86_64-unknown-linux-musl
          path: dist/bin/

      - name: Make binary executable
        run: chmod +x dist/bin/*

      - name: Prepare QNAP package
        run: |
          mkdir -p qnap-build/shared
          cp dist/bin/unified-hifi-linux-x64 qnap-build/shared/unified-hifi-control
          cp dist/bin/uhc-hiphi-pair-x64 qnap-build/shared/uhc-hiphi-pair
          chmod +x qnap-build/shared/unified-hifi-control
          chmod +x qnap-build/shared/uhc-hiphi-pair
          cp build/qnap/shared/*.sh qnap-build/shared/
          chmod +x qnap-build/shared/*.sh
          cp -r build/qnap/shared/icons qnap-build/
          sed "s/{{VERSION}}/${{ needs.plan.outputs.version }}/" build/qnap/qpkg.cfg > qnap-build/qpkg.cfg
          echo '#!/bin/sh' > qnap-build/package_routines

      - name: Build QPKG with Docker
        run: |
          docker build \
            --file build/qnap/Dockerfile \
            --tag qnap-qdk:2.5.3 \
            build/qnap
          docker run --rm --platform linux/amd64 \
            -v "$(pwd)/qnap-build:/src" \
            -w /src \
            qnap-qdk:2.5.3 \
            sh -c '/usr/share/QDK/bin/qbuild --build-dir /src/build --build-arch x86_64 && cp /src/build/*.qpkg /src/ && chmod 666 /src/*.qpkg'

      - name: Move QPKG to dist
        run: |
          mkdir -p dist/installers
          mv qnap-build/*.qpkg dist/installers/unified-hifi-control_${{ needs.plan.outputs.version }}_x86_64.qpkg

      # QNAP code-signing (issue #561): waiting on the owner to join the QNAP
      # developer program and obtain code-signing credentials. Prepared but
      # inactive - skips cleanly until QNAP_SIGNING_CERT/QNAP_SIGNING_KEY
      # secrets exist. Without a signature, QNAP App Center shows an
      # "unverified publisher" warning on install (documented in README).
      - name: Sign QPKG (QNAP developer program)
        if: ${{ env.HAS_QNAP_SIGNING == 'true' }}
        env:
          QNAP_SIGNING_CERT: ${{ secrets.QNAP_SIGNING_CERT }}
          QNAP_SIGNING_KEY: ${{ secrets.QNAP_SIGNING_KEY }}
        run: |
          echo "::error::QNAP_SIGNING_CERT/QNAP_SIGNING_KEY are set but the signing step is not implemented yet."
          echo "Once the owner has QNAP developer credentials, wire QDK's qpkg signing tool"
          echo "(codesign_pkg / QDK sign step) here, using the two secrets above, then remove"
          echo "this placeholder failure."
          exit 1

      - name: Note unsigned QPKG
        if: ${{ env.HAS_QNAP_SIGNING != 'true' }}
        run: echo "::notice::QNAP_SIGNING_CERT/QNAP_SIGNING_KEY not set - QPKG ships unsigned (App Center will show a signature warning). See docs/gh-release.md#release-signing."

      - name: Upload QNAP package
        uses: actions/upload-artifact@v7
        with:
          name: qnap-x86_64
          path: dist/installers/*.qpkg
          retention-days: 5

  # Note: Web assets are embedded in the binary (ADR 002)
  build-qnap-arm:
    name: Build QNAP (arm64)
    needs: [plan, build-linux-arm]
    if: |
      always() &&
      needs.plan.outputs.build_qnap_arm == 'true' &&
      needs.build-linux-arm.result == 'success'
    runs-on: ubuntu-latest
    # `secrets` isn't allowed directly in step `if:` conditions, so surface
    # the presence check as a job-level env var instead.
    env:
      HAS_QNAP_SIGNING: ${{ secrets.QNAP_SIGNING_CERT != '' && secrets.QNAP_SIGNING_KEY != '' }}
    steps:
      - uses: actions/checkout@v6

      - name: Download Linux binary
        uses: actions/download-artifact@v8
        with:
          name: binary-aarch64-unknown-linux-musl
          path: dist/bin/

      - name: Make binary executable
        run: chmod +x dist/bin/*

      - name: Prepare QNAP package
        run: |
          mkdir -p qnap-build/shared
          cp dist/bin/unified-hifi-linux-arm64 qnap-build/shared/unified-hifi-control
          cp dist/bin/uhc-hiphi-pair-arm64 qnap-build/shared/uhc-hiphi-pair
          chmod +x qnap-build/shared/unified-hifi-control
          chmod +x qnap-build/shared/uhc-hiphi-pair
          cp build/qnap/shared/*.sh qnap-build/shared/
          chmod +x qnap-build/shared/*.sh
          cp -r build/qnap/shared/icons qnap-build/
          sed "s/{{VERSION}}/${{ needs.plan.outputs.version }}/" build/qnap/qpkg.cfg > qnap-build/qpkg.cfg
          echo '#!/bin/sh' > qnap-build/package_routines

      - name: Build QPKG with Docker
        run: |
          docker build \
            --file build/qnap/Dockerfile \
            --tag qnap-qdk:2.5.3 \
            build/qnap
          docker run --rm --platform linux/amd64 \
            -v "$(pwd)/qnap-build:/src" \
            -w /src \
            qnap-qdk:2.5.3 \
            sh -c '/usr/share/QDK/bin/qbuild --build-dir /src/build --build-arch arm_64 && cp /src/build/*.qpkg /src/ && chmod 666 /src/*.qpkg'

      - name: Move QPKG to dist
        run: |
          mkdir -p dist/installers
          mv qnap-build/*.qpkg dist/installers/unified-hifi-control_${{ needs.plan.outputs.version }}_arm_64.qpkg

      # QNAP code-signing (issue #561): see the matching step in the x64 job
      # (build-qnap-x64) for context - same secrets, same TODO.
      - name: Sign QPKG (QNAP developer program)
        if: ${{ env.HAS_QNAP_SIGNING == 'true' }}
        env:
          QNAP_SIGNING_CERT: ${{ secrets.QNAP_SIGNING_CERT }}
          QNAP_SIGNING_KEY: ${{ secrets.QNAP_SIGNING_KEY }}
        run: |
          echo "::error::QNAP_SIGNING_CERT/QNAP_SIGNING_KEY are set but the signing step is not implemented yet."
          echo "Once the owner has QNAP developer credentials, wire QDK's qpkg signing tool"
          echo "(codesign_pkg / QDK sign step) here, using the two secrets above, then remove"
          echo "this placeholder failure."
          exit 1

      - name: Note unsigned QPKG
        if: ${{ env.HAS_QNAP_SIGNING != 'true' }}
        run: echo "::notice::QNAP_SIGNING_CERT/QNAP_SIGNING_KEY not set - QPKG ships unsigned (App Center will show a signature warning). See docs/gh-release.md#release-signing."

      - name: Upload QNAP package
        uses: actions/upload-artifact@v7
        with:
          name: qnap-arm_64
          path: dist/installers/*.qpkg
          retention-days: 5

  # Note: Web assets are embedded in the binary (ADR 002)
  build-docker-x64:
    name: Build Docker (x64)
    needs: [plan, build-linux-x64]
    # Only for PRs/branches - releases use build-docker-release
    if: needs.plan.outputs.build_docker == 'true' && needs.plan.outputs.is_release != 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Download Linux binary
        uses: actions/download-artifact@v8
        with:
          name: binary-x86_64-unknown-linux-musl
          path: binaries/

      - name: Prepare binary
        run: |
          mv binaries/unified-hifi-linux-x64 binaries/unified-hifi-linux-amd64
          mv binaries/uhc-hiphi-pair-x64 binaries/uhc-hiphi-pair-amd64
          chmod +x binaries/*
          ls -la binaries/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: muness/unified-hifi-control
          tags: |
            type=ref,event=pr
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: Dockerfile.ci
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # =============================================================================
  # RELEASE ONLY: Multi-arch Docker
  # =============================================================================

  # Note: Web assets are embedded in the binary (ADR 002)
  build-docker-release:
    name: Build Docker (${{ matrix.arch }})
    needs: [plan, build-linux-x64, build-linux-arm]
    if: needs.plan.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            target: x86_64-unknown-linux-musl
            binary: unified-hifi-linux-x64
            arch: amd64
            pairing_helper: uhc-hiphi-pair-x64
          - platform: linux/arm64
            target: aarch64-unknown-linux-musl
            binary: unified-hifi-linux-arm64
            arch: arm64
            pairing_helper: uhc-hiphi-pair-arm64
          - platform: linux/arm/v7
            target: armv7-unknown-linux-musleabihf
            binary: unified-hifi-linux-armv7
            arch: armv7
            pairing_helper: uhc-hiphi-pair-armv7
    steps:
      - uses: actions/checkout@v6

      - name: Download Linux binary
        uses: actions/download-artifact@v8
        with:
          name: binary-${{ matrix.target }}
          path: dist/

      - name: Prepare binary
        run: |
          mv dist/${{ matrix.binary }} dist/unified-hifi-control
          mv dist/${{ matrix.pairing_helper }} dist/uhc-hiphi-pair
          chmod +x dist/unified-hifi-control dist/uhc-hiphi-pair

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: Dockerfile.release
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=muness/unified-hifi-control,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: docker-digest-${{ matrix.target }}
          path: /tmp/digests/*
          retention-days: 1

  docker-manifest:
    name: Create Docker Manifest
    needs: [plan, build-docker-release]
    if: needs.plan.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for cosign keyless signing: it exchanges this token for a
      # short-lived certificate from Sigstore's public-good Fulcio CA, so no
      # long-lived signing key or secret is needed for the Docker images.
      id-token: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: docker-digest-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            muness/unified-hifi-control
            muness/roon-extension-knob
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'muness/unified-hifi-control@sha256:%s ' *)

      - name: Create manifest for legacy image name
        working-directory: /tmp/digests
        run: |
          TAGS=$(jq -cr '.tags | map(select(contains("roon-extension-knob"))) | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          if [ -n "$TAGS" ]; then
            docker buildx imagetools create $TAGS \
              $(printf 'muness/unified-hifi-control@sha256:%s ' *)
          fi

      # Free-tier release signing (issue #561): cosign keyless (sigstore)
      # signatures for every tag this release publishes. No secrets or
      # enrollment needed - cosign uses the job's GitHub OIDC token to get a
      # short-lived Fulcio certificate and records the signature in the
      # public Rekor transparency log.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign container images (cosign keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          for TAG in $(jq -cr '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON"); do
            echo "Signing $TAG"
            cosign sign --yes "$TAG"
          done

  # Note: Web assets are embedded in the binary (ADR 002)
  build-linux-packages:
    name: Build Linux Packages (deb/rpm)
    needs: [plan, build-linux-x64, build-linux-arm]
    if: |
      always() &&
      needs.plan.outputs.build_linux_packages == 'true' &&
      needs.build-linux-x64.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download Linux binaries
        uses: actions/download-artifact@v8
        with:
          pattern: binary-*-linux-*
          path: dist/bin/
          merge-multiple: true

      - name: Make binaries executable
        run: chmod +x dist/bin/*

      - name: Install fpm
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential rpm
          sudo gem install fpm

      - name: Build deb package (x64)
        run: |
          fpm -s dir -t deb \
            -n unified-hifi-control \
            -v ${{ needs.plan.outputs.version }} \
            --description "Source-agnostic hi-fi control bridge" \
            --url "https://github.com/open-horizon-labs/unified-hifi-control" \
            --license "PolyForm Noncommercial 1.0.0" \
            -a amd64 \
            --after-install build/linux/postinst.sh \
            dist/bin/unified-hifi-linux-x64=/usr/bin/unified-hifi-control \
            dist/bin/uhc-hiphi-pair-x64=/usr/bin/uhc-hiphi-pair \
            build/linux/unified-hifi-control.service=/etc/systemd/system/unified-hifi-control.service

      - name: Build rpm package (x64)
        run: |
          fpm -s dir -t rpm \
            -n unified-hifi-control \
            -v ${{ needs.plan.outputs.version }} \
            --description "Source-agnostic hi-fi control bridge" \
            --url "https://github.com/open-horizon-labs/unified-hifi-control" \
            --license "PolyForm Noncommercial 1.0.0" \
            -a x86_64 \
            --after-install build/linux/postinst.sh \
            dist/bin/unified-hifi-linux-x64=/usr/bin/unified-hifi-control \
            dist/bin/uhc-hiphi-pair-x64=/usr/bin/uhc-hiphi-pair \
            build/linux/unified-hifi-control.service=/etc/systemd/system/unified-hifi-control.service

      - name: Build deb package (arm64)
        if: hashFiles('dist/bin/unified-hifi-linux-arm64') != ''
        run: |
          fpm -s dir -t deb \
            -n unified-hifi-control \
            -v ${{ needs.plan.outputs.version }} \
            --description "Source-agnostic hi-fi control bridge" \
            --url "https://github.com/open-horizon-labs/unified-hifi-control" \
            --license "PolyForm Noncommercial 1.0.0" \
            -a arm64 \
            --after-install build/linux/postinst.sh \
            dist/bin/unified-hifi-linux-arm64=/usr/bin/unified-hifi-control \
            dist/bin/uhc-hiphi-pair-arm64=/usr/bin/uhc-hiphi-pair \
            build/linux/unified-hifi-control.service=/etc/systemd/system/unified-hifi-control.service

      - name: Build deb package (armv7/armhf)
        if: hashFiles('dist/bin/unified-hifi-linux-armv7') != ''
        run: |
          fpm -s dir -t deb \
            -n unified-hifi-control \
            -v ${{ needs.plan.outputs.version }} \
            --description "Source-agnostic hi-fi control bridge" \
            --url "https://github.com/open-horizon-labs/unified-hifi-control" \
            --license "PolyForm Noncommercial 1.0.0" \
            -a armhf \
            --after-install build/linux/postinst.sh \
            dist/bin/unified-hifi-linux-armv7=/usr/bin/unified-hifi-control \
            dist/bin/uhc-hiphi-pair-armv7=/usr/bin/uhc-hiphi-pair \
            build/linux/unified-hifi-control.service=/etc/systemd/system/unified-hifi-control.service

      - name: Upload Linux packages
        uses: actions/upload-artifact@v7
        with:
          name: linux-packages
          path: |
            *.deb
            *.rpm
          retention-days: 5

  # =============================================================================
  # RELEASE ONLY: Upload to GitHub Release
  # =============================================================================

  # Note: Web assets are embedded in the binary (ADR 002)
  upload-release:
    name: Upload to Release
    needs: [plan, build-linux-x64, build-linux-arm, build-macos-universal, build-applemusic-companion-dmg, build-windows, build-linux-packages, build-lms-universal, build-synology, build-qnap-x64, build-qnap-arm]
    # A skipped build-synology (prerelease tags: DSM rejects those version
    # strings) must not sink the whole release upload — every other artifact
    # is still required to succeed.
    if: |
      always() &&
      needs.plan.outputs.is_release == 'true' &&
      needs.build-linux-x64.result == 'success' &&
      needs.build-linux-arm.result == 'success' &&
      needs.build-macos-universal.result == 'success' &&
      needs.build-applemusic-companion-dmg.result == 'success' &&
      needs.build-windows.result == 'success' &&
      needs.build-linux-packages.result == 'success' &&
      needs.build-lms-universal.result == 'success' &&
      needs.build-qnap-x64.result == 'success' &&
      needs.build-qnap-arm.result == 'success' &&
      (needs.build-synology.result == 'success' || needs.build-synology.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # `secrets` isn't allowed directly in step `if:` conditions, so surface
    # the presence check as a job-level env var instead.
    env:
      HAS_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY != '' }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Display structure
        run: ls -R artifacts/

      - name: Flatten binaries
        run: |
          mkdir -p release
          find artifacts -name "unified-hifi-*" -type f \
            ! -name "*.js" ! -name "*.wasm" \
            -exec cp {} release/ \;
          find artifacts -name "*.deb" -type f -exec cp {} release/ \;
          find artifacts -name "*.rpm" -type f -exec cp {} release/ \;
          find artifacts -name "*.zip" -type f -exec cp {} release/ \;
          find artifacts -name "*.spk" -type f -exec cp {} release/ \;
          find artifacts -name "*.qpkg" -type f -exec cp {} release/ \;
          find artifacts -name "*.dmg" -type f -exec cp {} release/ \;
          ls -la release/

      # Free-tier release signing (issue #561): SHA256SUMS + detached GPG
      # signature for every release artifact. The signing key itself is
      # never committed - it's imported from the GPG_PRIVATE_KEY secret at
      # sign time. Until the owner adds that secret, this step notices and
      # skips cleanly; the release still ships (just unsigned).
      - name: Generate SHA256SUMS
        working-directory: release
        run: |
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      - name: Import GPG signing key
        id: gpg-import
        if: ${{ env.HAS_GPG_KEY == 'true' }}
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "has_key=true" >> "$GITHUB_OUTPUT"

      - name: GPG-sign SHA256SUMS
        if: steps.gpg-import.outputs.has_key == 'true'
        working-directory: release
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --detach-sign --armor -o SHA256SUMS.asc SHA256SUMS
          gpg --verify SHA256SUMS.asc SHA256SUMS
          ls -la

      - name: Print exported public key (for repo)
        if: steps.gpg-import.outputs.has_key == 'true'
        run: |
          echo "::notice::If docs/release-signing/gpg-public-key.asc is still the placeholder, copy the key printed below into that file and commit it so users can verify releases."
          gpg --armor --export

      - name: Note unsigned checksums
        if: steps.gpg-import.outputs.has_key != 'true'
        run: |
          echo "::warning::GPG_PRIVATE_KEY secret not set - SHA256SUMS ships without a .asc signature. See docs/gh-release.md#release-signing."

      - name: Generate asset list
        run: |
          cat > release-assets.md << 'EOF'
          ## Download Guide

          ### Standalone Binaries
          All binaries include embedded web assets - no separate download needed.

          | Platform | File |
          |----------|------|
          | Linux x64 | `unified-hifi-linux-x64` |
          | Linux ARM64 | `unified-hifi-linux-arm64` |
          | Linux ARMv7 | `unified-hifi-linux-armv7` |
          | macOS (Universal) | `unified-hifi-macos-universal` |
          | Windows x64 | `unified-hifi-win64.exe` |

          ### Linux Packages
          - `.deb` packages for Debian/Ubuntu
          - `.rpm` packages for Fedora/RHEL

          ### NAS Packages
          - `.spk` for Synology DSM 7+
          - `.qpkg` for QNAP

          ### macOS Companion Apps
          - `unified-hifi-applemusic-companion-macos-arm64-*.dmg` - Apple Music
            companion (Apple Silicon only). Unsigned: see the "Unsigned app"
            note in [companion/apple_music/README.md](https://github.com/${{ github.repository }}/blob/v4/companion/apple_music/README.md)
            for the right-click-Open / xattr workaround required on first launch.

          ### LMS Plugin
          - `lms-unified-hifi-control-*.zip` - Install via LMS Settings > Plugins

          ### Verifying downloads
          - `SHA256SUMS` - checksums for every file in this release
          - `SHA256SUMS.asc` - detached GPG signature over `SHA256SUMS` (present once the owner has enrolled the signing key; see below if absent)
          - Docker images (`muness/unified-hifi-control`) are signed keylessly with [cosign](https://docs.sigstore.dev/cosign/overview/) via GitHub Actions OIDC

          See [Verifying Release Artifacts](https://github.com/${{ github.repository }}/blob/v4/docs/gh-release.md#release-signing) for step-by-step verification commands.
          EOF

      - name: Generate beta LMS repository feed
        if: needs.plan.outputs.is_beta == 'true'
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          ZIP="release/lms-unified-hifi-control-${VERSION}.zip"
          SHA=$(sha1sum "$ZIP" | cut -d' ' -f1)
          REPO_URL="https://github.com/${{ github.repository }}"

          cat > release/lms-beta.xml << REPOXML
          <?xml version="1.0" encoding="UTF-8"?>
          <extensions>
            <plugins>
              <plugin name="UnifiedHiFi"
                      version="${VERSION}"
                      minTarget="8.0"
                      maxTarget="*">
                <title lang="EN">Unified Hi-Fi Control (Beta)</title>
                <desc lang="EN">Beta builds of Unified Hi-Fi Control for testing.</desc>
                <url>${REPO_URL}/releases/download/v${VERSION}/lms-unified-hifi-control-${VERSION}.zip</url>
                <sha>${SHA}</sha>
                <creator>Muness Castle</creator>
                <link>https://github.com/${{ github.repository }}/releases/tag/v${VERSION}</link>
              </plugin>
            </plugins>
          </extensions>
          REPOXML

          echo "Generated beta feed:"
          cat release/lms-beta.xml

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          append_body: true
          body_path: release-assets.md
          prerelease: ${{ needs.plan.outputs.is_beta == 'true' }}

  update-repo-xml:
    name: Update LMS repo.xml
    needs: [plan, upload-release]
    if: needs.plan.outputs.is_release == 'true' && needs.plan.outputs.is_beta != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v4

      - name: Get release version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Download LMS zip and compute SHA
        id: sha
        run: |
          ZIP_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/lms-unified-hifi-control-${{ steps.version.outputs.version }}.zip"
          echo "Downloading $ZIP_URL"
          curl -fSL --retry 3 --retry-delay 5 "$ZIP_URL" -o lms-plugin.zip
          FILE_SIZE=$(stat -c%s lms-plugin.zip 2>/dev/null || stat -f%z lms-plugin.zip)
          if [ "$FILE_SIZE" -lt 1024 ]; then
            echo "Error: Downloaded file too small ($FILE_SIZE bytes), expected > 1KB"
            exit 1
          fi
          SHA=$(sha1sum lms-plugin.zip | cut -d' ' -f1)
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Update repo.xml
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA="${{ steps.sha.outputs.sha }}"
          REPO_URL="https://github.com/${{ github.repository }}"

          cat > lms-plugin/repo.xml << 'REPOXML'
          <?xml version="1.0" encoding="UTF-8"?>
          <extensions>
            <plugins>
              <plugin name="UnifiedHiFi"
                      version="VERSION_PLACEHOLDER"
                      minTarget="8.0"
                      maxTarget="*">
                <title lang="EN">Unified Hi-Fi Control</title>
                <desc lang="EN">Source-agnostic hi-fi control bridge for Roon, LMS, HQPlayer, and hardware knobs. Provides HTTP APIs, MQTT integration, and web UI for controlling your audio system from anywhere.</desc>
                <url>URL_PLACEHOLDER</url>
                <sha>SHA_PLACEHOLDER</sha>
                <creator>Muness Castle</creator>
                <link>https://forums.lyrion.org/forum/user-forums/3rd-party-hardware/1804977-roon-knob-includes-lms-support</link>
              </plugin>
            </plugins>
          </extensions>
          REPOXML

          sed -i 's/^          //' lms-plugin/repo.xml
          sed -i "s|VERSION_PLACEHOLDER|$VERSION|" lms-plugin/repo.xml
          sed -i "s|URL_PLACEHOLDER|${REPO_URL}/releases/download/v${VERSION}/lms-unified-hifi-control-${VERSION}.zip|" lms-plugin/repo.xml
          sed -i "s|SHA_PLACEHOLDER|$SHA|" lms-plugin/repo.xml

      - name: Update install.xml version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s|<version>[^<]*</version>|<version>$VERSION</version>|" lms-plugin/install.xml

      - name: Create PR for LMS plugin update
        id: create-pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: Update LMS plugin to v${{ steps.version.outputs.version }}"
          title: "chore: Update LMS plugin to v${{ steps.version.outputs.version }}"
          body: "Auto-generated PR to update LMS plugin metadata for release v${{ steps.version.outputs.version }}."
          branch: chore/lms-update-${{ steps.version.outputs.version }}
          base: v4
          add-paths: |
            lms-plugin/repo.xml
            lms-plugin/install.xml

      - name: Enable auto-merge
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge ${{ steps.create-pr.outputs.pull-request-number }} --squash --auto

  # The beta counterpart of update-repo-xml.
  #
  # `upload-release` already generates `lms-beta.xml` and attaches it to the release, but a release
  # asset URL contains the version, so it changes with every beta. An LMS user cannot subscribe to
  # that: they would have to re-point their Additional Repositories entry at each new build, and
  # nothing told them the channel existed. The feed was generated and then unreachable.
  #
  # This commits the same file to a fixed path on `v4`, so the beta channel gets a permanent URL the
  # way the stable channel already has one via `lms-plugin/repo.xml`.
  #
  # It downloads the asset rather than regenerating the XML, so there is exactly one definition of
  # the beta feed. Regenerating it here would put a second copy of the template in this file, free
  # to drift from the one that actually ships.
  update-beta-repo-xml:
    name: Update LMS beta repo.xml
    needs: [plan, upload-release]
    if: needs.plan.outputs.is_release == 'true' && needs.plan.outputs.is_beta == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v4

      - name: Fetch the published beta feed
        run: |
          FEED_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/lms-beta.xml"
          echo "Downloading $FEED_URL"
          curl -fSL --retry 3 --retry-delay 5 "$FEED_URL" -o lms-plugin/repo-beta.xml

          # A GitHub error page is still a 200 from some proxies; refuse anything that is not the
          # feed rather than committing a broken repository file that LMS would choke on.
          if ! grep -q '<plugin name="UnifiedHiFi"' lms-plugin/repo-beta.xml; then
            echo "Downloaded file is not an LMS plugin feed:"
            head -20 lms-plugin/repo-beta.xml
            exit 1
          fi
          cat lms-plugin/repo-beta.xml

      - name: Create PR for LMS beta feed update
        id: create-pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: Point LMS beta feed at v${{ needs.plan.outputs.version }}"
          title: "chore: Point LMS beta feed at v${{ needs.plan.outputs.version }}"
          body: "Auto-generated. Updates `lms-plugin/repo-beta.xml` so the beta repository URL serves v${{ needs.plan.outputs.version }}."
          branch: chore/lms-beta-feed-${{ needs.plan.outputs.version }}
          base: v4
          add-paths: lms-plugin/repo-beta.xml

      - name: Enable auto-merge
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge ${{ steps.create-pr.outputs.pull-request-number }} --squash --auto

  publish-aur:
    name: Publish to AUR
    needs: [plan, upload-release]
    if: needs.plan.outputs.is_release == 'true' && needs.plan.outputs.is_beta != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Get release version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Update PKGBUILD version and checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd build/arch

          checksum_url() {
            curl --fail --silent --show-error --location \
              --retry 5 --retry-all-errors --retry-delay 2 "$1" \
              | sha256sum | cut -d ' ' -f 1
          }

          release_url="https://github.com/open-horizon-labs/unified-hifi-control/releases/download/v${VERSION}"
          source_url="https://raw.githubusercontent.com/open-horizon-labs/unified-hifi-control/v${VERSION}"
          service_sha=$(sha256sum unified-hifi-control.service | cut -d ' ' -f 1)
          license_sha=$(checksum_url "${source_url}/LICENSE")
          x86_64_sha=$(checksum_url "${release_url}/unified-hifi-linux-x64")
          aarch64_sha=$(checksum_url "${release_url}/unified-hifi-linux-arm64")
          armv7h_sha=$(checksum_url "${release_url}/unified-hifi-linux-armv7")

          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          perl -0pi -e "s/sha256sums=\\([^)]*\\)/sha256sums=('${service_sha}'\\n            '${license_sha}')/" PKGBUILD
          sed -i "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('${x86_64_sha}')/" PKGBUILD
          sed -i "s/^sha256sums_aarch64=.*/sha256sums_aarch64=('${aarch64_sha}')/" PKGBUILD
          sed -i "s/^sha256sums_armv7h=.*/sha256sums_armv7h=('${armv7h_sha}')/" PKGBUILD

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.1
        with:
          pkgname: unified-hifi-control-bin
          pkgbuild: build/arch/PKGBUILD
          assets: |
            build/arch/unified-hifi-control.service
            build/arch/unified-hifi-control.install
            build/arch/LICENSE
            build/arch/LICENSES
            build/arch/REUSE.toml
          commit_username: ${{ github.actor }}
          commit_email: ${{ github.actor }}@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to v${{ steps.version.outputs.version }}"

  # =============================================================================
  # Build Summary
  # =============================================================================

  summary:
    name: Build Summary
    needs:
      - plan
      - lint
      - test
      - synology-package-test
      - qnap-package-test
      - build-wasm
      - build-linux-x64
      - smoke-test
      - build-linux-arm
      - build-macos-universal
      - build-applemusic-companion-dmg
      - build-windows
      - build-lms-universal
      - build-synology
      - build-qnap-x64
      - build-qnap-arm
      - build-docker-x64
      - build-docker-release
      - build-linux-packages
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/
        continue-on-error: true

      - name: Display build summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Binaries" >> $GITHUB_STEP_SUMMARY
          echo "| Binary | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|------|" >> $GITHUB_STEP_SUMMARY
          find artifacts -name 'unified-hifi-*' -type f 2>/dev/null | while read f; do
            size=$(du -h "$f" | cut -f1)
            name=$(basename "$f")
            echo "| $name | $size |" >> $GITHUB_STEP_SUMMARY
          done || echo "| (none) | - |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Packages" >> $GITHUB_STEP_SUMMARY
          echo "| Package | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|------|" >> $GITHUB_STEP_SUMMARY
          find artifacts -name '*.qpkg' -o -name '*.spk' -o -name '*.zip' -o -name '*.deb' -o -name '*.rpm' 2>/dev/null | while read f; do
            size=$(du -h "$f" | cut -f1)
            name=$(basename "$f")
            echo "| $name | $size |" >> $GITHUB_STEP_SUMMARY
          done || echo "| (none) | - |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Add \`build:*\` labels to trigger specific builds, or \`build-me\` for defaults. Labels: build:lms, build:synology, build:qnap-arm, build:linux-arm, build:macos, build:windows, build:docker, build:all_" >> $GITHUB_STEP_SUMMARY

  # =============================================================================
  # PR Comment with Artifact Links
  # =============================================================================

  pr-comment:
    name: Post Artifact Links
    needs: [summary]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post artifact links to PR
        uses: actions/github-script@v8
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const runId = context.runId;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;

            // Get artifacts for this run
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId
            });

            // Build artifact table
            let artifactTable = '';
            if (artifacts.data.artifacts.length > 0) {
              artifactTable = '| Artifact | Size |\n|----------|------|\n';
              for (const artifact of artifacts.data.artifacts) {
                const size = (artifact.size_in_bytes / 1024 / 1024).toFixed(1) + ' MB';
                artifactTable += `| ${artifact.name} | ${size} |\n`;
              }
            } else {
              artifactTable = '_No artifacts uploaded_';
            }

            const body = `### 📦 Build Artifacts

            ${artifactTable}

            [View workflow run](${runUrl}) to download artifacts.

            _Updated: ${new Date().toISOString()}_`;

            // Check if we already posted a comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });

            const botComment = comments.data.find(c =>
              c.user.type === 'Bot' && c.body.includes('Build Artifacts')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body
              });
            }
