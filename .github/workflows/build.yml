      - name: Create universal binary with lipo
        run: |
          mkdir -p dist/bin
          lipo -create \
            x64/unified-hifi-control \
            arm64/unified-hifi-control \
            -output dist/bin/unified-hifi-macos-universal
          lipo -create \
            x64/uhc-hiphi-pair \
            arm64/uhc-hiphi-pair \
            -output dist/bin/uhc-hiphi-pair-macos-universal
