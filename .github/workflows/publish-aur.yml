name: Publish AUR release

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
    secrets:
      AUR_SSH_PRIVATE_KEY:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: 'Published stable version, e.g. 4.0.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-aur
  cancel-in-progress: false

jobs:
  publish:
    # The deploy action is a Docker container; fleet linux-general has no daemon.
    runs-on: ubuntu-latest
    steps:
      - name: Validate stable version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
      - uses: actions/checkout@v7
        with:
          ref: v${{ inputs.version }}

      - name: Get release version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update PKGBUILD version and checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd build/arch

          checksum_url() {
            curl --fail --silent --show-error --location \
              --retry 5 --retry-all-errors --retry-delay 2 "$1" \
              | sha256sum | cut -d ' ' -f 1
          }

          release_url="https://github.com/open-horizon-labs/unified-hifi-control/releases/download/v${VERSION}"
          source_url="https://raw.githubusercontent.com/open-horizon-labs/unified-hifi-control/v${VERSION}"
          service_sha=$(sha256sum unified-hifi-control.service | cut -d ' ' -f 1)
          license_sha=$(checksum_url "${source_url}/LICENSE")
          x86_64_sha=$(checksum_url "${release_url}/unified-hifi-linux-x64")
          aarch64_sha=$(checksum_url "${release_url}/unified-hifi-linux-arm64")
          armv7h_sha=$(checksum_url "${release_url}/unified-hifi-linux-armv7")

          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          perl -0pi -e "s/sha256sums=\\([^)]*\\)/sha256sums=('${service_sha}'\\n            '${license_sha}')/" PKGBUILD
          sed -i "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('${x86_64_sha}')/" PKGBUILD
          sed -i "s/^sha256sums_aarch64=.*/sha256sums_aarch64=('${aarch64_sha}')/" PKGBUILD
          sed -i "s/^sha256sums_armv7h=.*/sha256sums_armv7h=('${armv7h_sha}')/" PKGBUILD

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: unified-hifi-control-bin
          pkgbuild: build/arch/PKGBUILD
          assets: |
            build/arch/unified-hifi-control.service
            build/arch/unified-hifi-control.install
            build/arch/LICENSE
            build/arch/LICENSES
            build/arch/REUSE.toml
          commit_username: ${{ github.actor }}
          commit_email: ${{ github.actor }}@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to v${{ steps.version.outputs.version }}"

