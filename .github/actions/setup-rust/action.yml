name: Reviewed Rust baseline
description: Install the single reviewed Rust version declared in rust-toolchain.toml
inputs:
  targets:
    description: Additional target triples
    default: ''
  components:
    description: Additional components
    default: clippy, rustfmt
runs:
  using: composite
  steps:
    - name: Read reviewed toolchain
      id: baseline
      shell: bash
      run: |
        channel=$(sed -n 's/^channel = "\([0-9][0-9.]*\)"$/\1/p' rust-toolchain.toml)
        test -n "$channel"
        echo "channel=$channel" >> "$GITHUB_OUTPUT"
        echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.baseline.outputs.channel }}
        targets: ${{ inputs.targets }}
        components: ${{ inputs.components }}
