# Local build optimizations
#
# sccache: Shared compilation cache - caches compiled crates across projects
# Install: brew install sccache (macOS) or cargo install sccache
# Enable: add to your shell profile: export RUSTC_WRAPPER=sccache

# Keep the statically linked Linux release artifacts position-independent and
# fully RELRO-hardened. These target-specific flags do not affect host tools,
# build scripts, WASM, macOS, or Windows builds.
[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "relocation-model=pic", "-C", "relro-level=full"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "relocation-model=pic", "-C", "relro-level=full"]

[target.armv7-unknown-linux-musleabihf]
rustflags = ["-C", "relocation-model=pic", "-C", "relro-level=full"]
