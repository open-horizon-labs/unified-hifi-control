[package]
name = "naa-router"
version = "0.1.0"
edition = "2021"
description = "Private HiPhi NAA routing proof of concept"

[dependencies]
naa-native = { path = "../naa-native" }
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
# TCP keepalive on the NAA sockets (std exposes no setsockopt); already a
# transitive dependency through naa-native.
libc = "0.2"
